# ========================================================
# ProTrack Database Configuration
# ========================================================
# Production deployments and local overrides can supply environment
# variables (DB_DRIVER, DB_URL, DB_USER, DB_PASSWORD) which take
# precedence over the default properties defined below.
# ========================================================
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/project_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=root

# Connection pool sizing parameters
db.initialSize=5
db.maxTotal=20
